<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Text With Image or Video</title>
    <link rel="stylesheet" href="../../../../../dist/clientlib-site/site.css" >
    <script type="text/javascript" src="../../../../../dist/clientlib-site/site.js"></script>
</head>
<body>

  <!-- Video variant -->
  <section class="c-text-with-image container">
    <div class="c-twi__inner">
      <div class="c-twi__tag">About Bibigo</div>
      <h2 class="c-twi__title">Discover The Essence Of Bibigo</h2>
      <p class="c-twi__desc">Same layout with video. Play button is centered; other controls are hidden until play.</p>

      <div class="js--twi c-twi__media" data-type="local" data-src="../../../../../dist/clientlib-site/videos/bibigo-video.mp4" data-poster="../../../../../dist/clientlib-site/images/video-thumbnail.jpg">
          <img class="poster" src="../../../../../dist/clientlib-site/images/video-thumbnail.jpg" alt="poster">
          <button class="play-btn" aria-label="Play video"></button>
      </div>

  <div style="height:48px"></div>


    <!-- YouTube example -->
    <div class="js--twi c-twi__media" data-type="embed" data-src="https://www.youtube.com/embed/soaoHF6x0Rg?si=9gDpWRrJhX8ks39-" data-poster="../../../../../dist/clientlib-site/images/video-thumbnail.jpg">
        <img class="poster" src="../../../../../dist/clientlib-site/images/video-thumbnail.jpg" alt="poster">
        <button class="play-btn" aria-label="Play YouTube video"></button>
    </div>
    </div>
  </section>

  <script>
    class InlineVideoCard {
    constructor(el){
    this.el = el;
    this.type = el.dataset.type;
    this.src = el.dataset.src;
    this.poster = el.dataset.poster;
    this.playBtn = el.querySelector('.play-btn');
    this.posterImg = el.querySelector('.poster');
    this.bindEvents();
    }


    bindEvents(){
    this.playBtn.addEventListener('click', ()=>this.play());
    }


    play(){
    if(this.type === 'local'){
    this.playLocal();
    } else if(this.type === 'embed'){
    this.playEmbed();
    }
    }


    playLocal(){
    const video = document.createElement('video');
    video.src = this.src;
    if(video.src){
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    video.poster = this.poster;
    this.el.innerHTML = '';
    this.el.appendChild(video);
    }
    else{
      showError('Video unavailable');
    }
    }


    playEmbed(){
    const iframe = document.createElement('iframe');
    iframe.src = `${this.src}`;
    if(iframe.src){
    iframe.allowFullscreen = true;
    this.el.innerHTML = '';
    this.el.appendChild(iframe);
    }
    else{
      showError('Video unavailable');
    }
    }
    }
    document.querySelectorAll('.js--twi').forEach(el=> new InlineVideoCard(el));
  </script>
